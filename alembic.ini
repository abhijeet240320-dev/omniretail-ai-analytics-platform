# ============================================================
# Alembic configuration - OmniRetail AI Analytics Platform
#
# Run from the REPOSITORY ROOT (every other tool here does):
#     .venv/Scripts/python.exe -m alembic current
#     .venv/Scripts/python.exe -m alembic upgrade head
#     .venv/Scripts/python.exe -m alembic revision --autogenerate -m "..."
#
# `script_location` is relative to the CURRENT DIRECTORY, not to this file -
# that is Alembic's behaviour, not a choice - so `cd` matters. `prepend_sys_path`
# is what puts `backend/` on sys.path so env.py can `import app.models`.
#
# WHY sqlalchemy.url IS INTENTIONALLY ABSENT
# ------------------------------------------
# Alembic allows a URL here. This project refuses. Putting a password in a
# committed file is the one mistake that cannot be undone by rewriting history,
# because everybody who clones gets a copy. env.py reads the URL from the same
# `app.core.config.Settings` object the loader, the API and the notebooks use,
# so there is exactly one place credentials come from and it is `.env`, which
# is gitignored. The placeholder below is there only so that Alembic's config
# parser does not complain; env.py overwrites it before any connection is made.
# ============================================================

[alembic]
script_location = backend/alembic
prepend_sys_path = backend
# Without this, alembic 1.20 warns that it is "falling back to legacy splitting
# on spaces, commas, and colons". `os` is the honest separator and the warning
# stops polluting the output of every migration command.
path_separator = os

# Placeholder only - never used. See the note above.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Path to the template used for new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timestamps in revision filenames are UTC, so two people generating a revision
# in different timezones cannot produce files that sort differently.
timezone = UTC

[post_write_hooks]
# Empty on purpose. Formatting is not automatic here: a hook that rewrites a
# generated file makes it impossible to tell what Alembic actually produced, and
# the baseline migration is meant to be readable as the authoritative record of
# the schema. If a formatter is added later it belongs in the pre-commit config,
# where it applies to hand-written files too.

# ============================================================
# Logging
#
# env.py calls fileConfig() on this file, which REQUIRES these four sections to
# exist - it raises KeyError: 'formatters' otherwise. So they are here whether or
# not the logging is interesting.
#
# WARNING is the floor deliberately: Alembic logs every detected difference at
# INFO, and on a 30-table schema that is a wall of text that buries the one line
# that matters ("Detected added table..."). Raise it to INFO when you are
# deliberately reviewing a diff and want to see each comparison.
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
