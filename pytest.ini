[pytest]
testpaths = backend/tests
python_files = test_*.py
# `slow` marks tests that re-execute the whole analytics corpus against
# PostgreSQL, which takes several minutes. Deselect them with:
#     pytest -m "not slow"
# and run everything with:
#     pytest
markers =
    slow: re-executes every analytics query against the live database

filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*